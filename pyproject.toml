[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olimar"
version = "0.1.0"
description = "Pikmin Bloom 蘑菇派遣助手（iPhone 鏡像輸出 + macOS Vision OCR）"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
olimar = "olimar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
olimar = ["vision.swift"]
